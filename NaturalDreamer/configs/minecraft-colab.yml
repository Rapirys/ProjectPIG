environmentName: Minecraft
runName: Minecraft-Training-2D
seed: 1

gradientSteps: 60000
replayRatio: 200
saveMetrics: True        # Saves metrics at replayRatio interval
saveCheckpoints: True
checkpointInterval: 900
resume: False
checkpointToLoad: 1k
#
episodesBeforeStart: 1
numInteractionEpisodes: 1
numEvaluationEpisodes: 1


dreamer:
  actionRepeat: 3
  batchSize: 32
  batchLength: 64
  imaginationHorizon: 32

  recurrentSize: 4096 #1024*8
  latentLength: 32 #32
  latentClasses: 64 #64
  encodedObsSize: 2048
#  resolution: [256, 448]
#  resolution: [160, 368]
  resolution: [ 64, 64 ]

  actorLR: 0.00004
  criticLR: 0.0001
  worldModelLR: 0.0002
  gradientNormType: 2
  gradientClip: 100

  discount: 0.997
  lambda_: 0.95
  freeNats: 1
  betaPrior: 1.0
  betaPosterior: 0.1
  entropyScale: 0.0003

  buffer:
    capacity: 10000 #TODO Bigger buffer in real training
    minecraft:
      scene_size: [20, 16, 20]

  encoder:
    depth: 16
    stride: 2
    kernelSize: 4
    activation: Tanh #TODO activation = RElU

  decoder:
    depth: 16
    stride: 2
    kernelSize: 4
    activation: Tanh

  recurrentModel:
    hiddenSize: 512
    num_blocks: 4
    activation: Tanh

  priorNet:
    hiddenSize: 1024
    numLayers: 2
    activation: Tanh
    uniformMix: 0.01

  posteriorNet:
    hiddenSize: 1024
    numLayers: 2
    activation: Tanh
    uniformMix: 0.01

  reward:
    hiddenSize: 1024
    numLayers: 2
    activation: Tanh

  continuation:
    hiddenSize: 1024
    numLayers: 3
    activation: Tanh

  actor:
    hiddenSize: 400
    numLayers: 2
    activation: Tanh

  critic:
    hiddenSize: 400
    numLayers: 3
    activation: Tanh

  minecraft:
    fov: 90
    classes: 236
    scene_size: [20, 16, 20]
    projection_scale: 1
    prediction_head:
      dilations: [1, 2, 3]
      feature_size: 64 #64



folderNames:
  metricsFolder: metrics
  plotsFolder: plots
  checkpointsFolder: checkpoints
  videosFolder: videos


