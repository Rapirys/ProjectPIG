[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malmo"          # or "malmoenv"; this is the dist name, not the import
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
package-dir = {"" = "Malmo/MalmoEnv"}

[tool.setuptools.packages.find]
where = ["Malmo/MalmoEnv", "MinecraftSCC"]
include = ["malmoenv*", "minecraftscc"] # finds malmoenv package
