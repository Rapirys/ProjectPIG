# docker-compose.yml (repo root)
services:
  malmo_dreamer:
    build: .
    shm_size: "4gb"
    ports:
      - "10000:10000"
    environment:
      - TZ=Europe/Zagreb
    # Optional: persist logs on host
    volumes:
      - ./docker_logs:/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
